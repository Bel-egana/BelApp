<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BelApp — Music Organizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
  <div class="logo"><span class="logo-bel">Bel</span><span class="logo-app">App</span></div>
  <div class="logo-sub">Music Organizer</div>

  <nav>
    <button id="nav-cargar" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Cargar</span>
    </button>
    <button id="nav-buscar" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Buscar &amp; Confirmar</span>
    </button>
    <button id="nav-resultado" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Resultado</span>
    </button>
    <button id="nav-historial" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Historial</span>
    </button>
  </nav>

  <div class="sidebar-foot">Discogs Search Edition</div>
</aside>

<main>
  <section id="view-cargar" class="view">
    <h1>Cargar tracks</h1>
    <p class="placeholder-note">Vista en construcción — Task 2</p>
  </section>

  <section id="view-buscar" class="view">
    <h1>Buscar &amp; Confirmar</h1>
    <p class="placeholder-note">Vista en construcción — Task 3</p>
  </section>

  <section id="view-resultado" class="view">
    <h1>Resultado</h1>
    <p class="placeholder-note">Vista en construcción — Task 4</p>
  </section>

  <section id="view-historial" class="view">
    <h1>Historial</h1>
    <p class="placeholder-note">Vista en construcción — Task 5</p>
  </section>

  <footer id="status">Conectando con Python…</footer>
</main>

<script src="app.js"></script>
</body>
</html>
